<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="app-version" content="11" />
  <title>Polo AI</title>
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <!-- Botón de tres rayas (esquina superior izquierda) -->
  <button id="btn-menu-lateral" class="btn-hamburguesa" type="button"
          aria-label="Abrir menú lateral" aria-controls="barra-lateral" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <!-- Barra lateral con inicio de sesión -->
  <div id="fondo-lateral" class="fondo-lateral" hidden></div>
  <aside id="barra-lateral" class="barra-lateral" aria-label="Menú lateral" aria-hidden="true">
    <div class="lateral-cabecera">
      <strong>Polo AI</strong>
      <button id="lateral-cerrar" class="lateral-cerrar" type="button" aria-label="Cerrar menú">&times;</button>
    </div>

    <h2 class="lateral-titulo">Cuenta</h2>

    <!-- Sin sesión -->
    <div id="cuenta-sin-sesion">
      <p class="lateral-texto">Inicia sesión con tu cuenta de Google.</p>
      <div id="google-boton"></div>
      <p id="google-aviso" class="lateral-aviso" hidden></p>
    </div>

    <!-- Con sesión -->
    <div id="cuenta-con-sesion" hidden>
      <div class="cuenta-perfil">
        <img id="cuenta-foto" class="cuenta-foto" alt="" referrerpolicy="no-referrer" hidden />
        <div class="cuenta-datos">
          <strong id="cuenta-nombre"></strong>
          <span id="cuenta-correo"></span>
        </div>
      </div>
      <button id="cuenta-salir" class="btn-salir" type="button">Cerrar sesión</button>
    </div>

    <!-- Herramientas -->
    <hr class="lateral-separador" />
    <button id="btn-notas" class="btn-lateral-notas" type="button">
      <span class="btn-lateral-icono" aria-hidden="true">&#128221;</span>
      <span>Notas</span>
    </button>
  </aside>

  <!-- Panel grande de Notas (azul pastel). Las notas viven en la segunda hoja de Google Sheets -->
  <div id="panel-notas" class="panel-notas" hidden>
    <div class="notas-caja" role="dialog" aria-modal="true" aria-labelledby="notas-titulo">
      <div class="notas-decor" aria-hidden="true">
        <span class="decor decor-1">&#9729;&#65039;</span>
        <span class="decor decor-2">&#10024;</span>
        <span class="decor decor-3">&#127769;</span>
        <span class="decor decor-4">&#9729;&#65039;</span>
        <span class="decor decor-5">&#10024;</span>
        <span class="decor decor-6">&#128153;</span>
      </div>

      <header class="notas-cabecera">
        <h2 id="notas-titulo">Notas</h2>
        <div class="notas-cab-botones">
          <button id="notas-actualizar" class="notas-btn-icono" type="button"
                  title="Volver a leer las notas de Google Sheets" aria-label="Actualizar notas">&#8635;</button>
          <button id="notas-cerrar" class="notas-btn-icono" type="button" aria-label="Cerrar notas">&times;</button>
        </div>
      </header>

      <div class="notas-cuerpo">
        <!-- Sin sesión -->
        <div id="notas-sin-sesion" class="notas-aviso-sesion" hidden>
          <p>Inicia sesión con tu cuenta de Google para ver y guardar tus notas.</p>
          <button id="notas-ir-login" class="notas-btn" type="button">Iniciar sesión</button>
        </div>

        <!-- Con sesión -->
        <div id="notas-contenido">
          <div id="notas-form" class="notas-nueva">
            <div class="notas-campos">
              <label class="notas-campo">
                <span>Nombre</span>
                <input id="notas-nombre" type="text" maxlength="80" placeholder="Nombre de la nota" autocomplete="off" />
              </label>
              <label class="notas-campo">
                <span>Etiqueta</span>
                <select id="notas-etiqueta"></select>
              </label>
            </div>
            <div class="notas-campo">
              <span>Color</span>
              <div id="notas-colores" class="notas-colores" role="radiogroup" aria-label="Color de la nota"></div>
            </div>
            <textarea id="notas-texto" rows="4" maxlength="5000"
                      placeholder="Escribe una nota nueva…" aria-label="Nueva nota"></textarea>
            <div class="notas-fila">
              <button id="notas-guardar" class="notas-btn" type="button">Guardar nota</button>
              <span id="notas-estado" class="notas-estado"></span>
            </div>
          </div>
          <div id="notas-lista" class="notas-lista"></div>
        </div>
      </div>
    </div>
  </div>

  <header class="encabezado">
    <h1>Polo AI</h1>
    <nav class="menu" aria-label="Secciones">
      <button class="btn-menu" data-seccion="calendario">Calendario</button>
      <button class="btn-menu" data-seccion="actividades">Actividades</button>
      <button class="btn-menu" data-seccion="pendientes">Pendientes</button>
      <button class="btn-menu" data-seccion="trabajo">Trabajo</button>
    </nav>
  </header>

  <main>
    <p id="inicio" class="mensaje-inicio">Elige una sección para comenzar.</p>

    <!-- CALENDARIO -->
    <section id="calendario" class="seccion" hidden>
      <div class="cal-controles">
        <button id="cal-anterior" class="btn-cal" aria-label="Mes anterior">&#8249;</button>
        <select id="cal-mes" aria-label="Mes"></select>
        <select id="cal-anio" aria-label="Año"></select>
        <button id="cal-siguiente" class="btn-cal" aria-label="Mes siguiente">&#8250;</button>
        <button id="cal-hoy" class="btn-cal btn-hoy">Hoy</button>
        <button id="cal-actualizar" class="btn-cal" title="Volver a leer los datos de Google Sheets" aria-label="Actualizar datos">&#8635;</button>
      </div>

      <p id="cal-estado" class="cal-estado" hidden></p>

      <div id="cal-cuadricula" class="cal-cuadricula" role="grid"></div>

      <!-- Panel grande anclado al día seleccionado -->
      <div id="dia-popover" class="popover" role="dialog" aria-labelledby="pop-titulo" hidden>
        <div class="pop-cabecera">
          <h3 id="pop-titulo"></h3>
          <button id="pop-cerrar" class="pop-cerrar" aria-label="Cerrar">&times;</button>
        </div>

        <!--
          Tres secciones, una debajo de otra: Descripción, Actividades y Anotaciones.
          Cada una tiene un botón con flecha (abre la zona de texto) y, pegado debajo,
          un botón "Desplegar" (abre los recuadros del 5 en adelante; los primeros 4 siempre se ven).
        -->
        <div id="pop-secciones" class="pop-cuerpo">

          <section class="pop-seccion" data-campo="descripcion">
            <button type="button" class="pop-toggle pop-toggle-texto" data-accion="texto" aria-expanded="false">
              <span>Descripción</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-texto" hidden>
              <textarea rows="4" placeholder="Escribe una descripción nueva…" aria-label="Nueva descripción"></textarea>
              <div class="pop-acciones">
                <button type="button" class="btn-guardar">Guardar</button>
                <span class="pop-estado"></span>
              </div>
            </div>
            <div class="pop-panel pop-panel-fija">
              <div class="lista-notas lista-fija"></div>
              <p class="pop-estado pop-estado-lista"></p>
            </div>
            <button type="button" class="pop-toggle pop-toggle-lista" data-accion="lista" aria-expanded="false" hidden>
              <span class="pop-lista-etiqueta">Desplegar</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-lista" hidden>
              <div class="lista-notas lista-extra"></div>
            </div>
          </section>

          <section class="pop-seccion" data-campo="actividades">
            <button type="button" class="pop-toggle pop-toggle-texto" data-accion="texto" aria-expanded="false">
              <span>Actividades</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-texto" hidden>
              <textarea rows="4" placeholder="Escribe una actividad nueva…" aria-label="Nueva actividad"></textarea>
              <div class="pop-acciones">
                <button type="button" class="btn-guardar">Guardar</button>
                <span class="pop-estado"></span>
              </div>
            </div>
            <div class="pop-panel pop-panel-fija">
              <div class="lista-notas lista-fija"></div>
              <p class="pop-estado pop-estado-lista"></p>
            </div>
            <button type="button" class="pop-toggle pop-toggle-lista" data-accion="lista" aria-expanded="false" hidden>
              <span class="pop-lista-etiqueta">Desplegar</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-lista" hidden>
              <div class="lista-notas lista-extra"></div>
            </div>
          </section>

          <section class="pop-seccion" data-campo="anotaciones">
            <button type="button" class="pop-toggle pop-toggle-texto" data-accion="texto" aria-expanded="false">
              <span>Anotaciones</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-texto" hidden>
              <textarea rows="4" placeholder="Escribe una anotación nueva…" aria-label="Nueva anotación"></textarea>
              <div class="pop-acciones">
                <button type="button" class="btn-guardar">Guardar</button>
                <span class="pop-estado"></span>
              </div>
            </div>
            <div class="pop-panel pop-panel-fija">
              <div class="lista-notas lista-fija"></div>
              <p class="pop-estado pop-estado-lista"></p>
            </div>
            <button type="button" class="pop-toggle pop-toggle-lista" data-accion="lista" aria-expanded="false" hidden>
              <span class="pop-lista-etiqueta">Desplegar</span><span class="flecha" aria-hidden="true">&#9662;</span>
            </button>
            <div class="pop-panel pop-panel-lista" hidden>
              <div class="lista-notas lista-extra"></div>
            </div>
          </section>

        </div>
      </div>
    </section>

    <!-- ACTIVIDADES -->
    <section id="actividades" class="seccion" hidden>
      <h2>Actividades</h2>
      <p>Próximamente.</p>
    </section>

    <!-- PENDIENTES -->
    <section id="pendientes" class="seccion" hidden>
      <h2>Pendientes</h2>
      <p>Próximamente.</p>
    </section>

    <!-- TRABAJO -->
    <section id="trabajo" class="seccion" hidden>
      <h2>Trabajo</h2>
      <p>Próximamente.</p>
    </section>
  </main>

  <script src="config.js?v=11"></script>
  <script src="app.js?v=11"></script>
  <script type="module" src="firebase.js?v=11"></script>
</body>
</html>
